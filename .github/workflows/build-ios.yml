name: Build iOS IPA

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: macos-15 # 使用更稳定的 macOS 15 环境

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Swift Version
      run: swift --version

    - name: Build the app
      run: |
        cd QuizAppiOS
        # 使用 SPM 构建 Release 版本
        swift build -c release

    - name: Package to IPA
      run: |
        cd QuizAppiOS
        # 找到构建出的 .app 文件，Swift 包默认产物在 .build/release 下
        APP_PATH=$(find .build/release -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "未找到 .app 文件，构建可能失败。"
          exit 1
        fi
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r Unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Unsigned-IPA
        path: QuizAppiOS/Unsigned.ipa
