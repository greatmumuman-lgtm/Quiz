name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Swift Version
      run: swift --version

    - name: Build the app
      run: |
        cd QuizAppiOS
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        swift build -c release -Xswiftc "-sdk" -Xswiftc "$SDK_PATH" -Xswiftc "-target" -Xswiftc "arm64-apple-ios12.0"

    - name: Package to IPA
      run: |
        cd QuizAppiOS
        APP_PATH=$(find .build/release -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "未找到 .app 文件，构建可能失败。"
          exit 1
        fi
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r Unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Unsigned-IPA
        path: QuizAppiOS/Unsigned.ipa
