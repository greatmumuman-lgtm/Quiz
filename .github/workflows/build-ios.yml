name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build the app
      run: |
        cd QuizAppiOS
        xcodebuild -resolvePackageDependencies -scheme QuizAppiOS -derivedDataPath build
        xcodebuild build \
          -scheme QuizAppiOS \
          -sdk iphoneos \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -derivedDataPath build \
          -disableAutomaticPackageResolution \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          EXCLUDED_ARCHS=x86_64

    - name: Package to IPA
      run: |
        cd QuizAppiOS
        
        # 1. 手动创建标准的 Payload 和 App 目录结构
        mkdir -p Payload/QuizAppiOS.app
        
        # 2. 把编译出来的可执行文件复制进去，并赋予可执行权限
        cp build/Build/Products/Release-iphoneos/QuizAppiOS Payload/QuizAppiOS.app/QuizAppiOS
        chmod +x Payload/QuizAppiOS.app/QuizAppiOS
        
        # 3. 使用单行 printf 写入 Info.plist，绝不报错
        printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>CFBundleDevelopmentRegion</key>\n<string>en</string>\n<key>CFBundleExecutable</key>\n<string>QuizAppiOS</string>\n<key>CFBundleIdentifier</key>\n<string>com.quiz.appios</string>\n<key>CFBundleInfoDictionaryVersion</key>\n<string>6.0</string>\n<key>CFBundleName</key>\n<string>QuizAppiOS</string>\n<key>CFBundlePackageType</key>\n<string>APPL</string>\n<key>CFBundleShortVersionString</key>\n<string>1.0</string>\n<key>CFBundleVersion</key>\n<string>1</string>\n<key>LSRequiresIPhoneOS</key>\n<true/>\n<key>MinimumOSVersion</key>\n<string>16.0</string>\n<key>UIDeviceFamily</key>\n<array>\n<integer>1</integer>\n<integer>2</integer>\n</array>\n<key>UILaunchScreen</key>\n<dict/>\n</dict>\n</plist>' > Payload/QuizAppiOS.app/Info.plist
        
        # 4. 打包成最终你需要的 ipa
        echo "✅ 生成 .app 外壳成功，正在压缩为 ipa..."
        zip -r Unsigned.ipa Payload
        echo "✅ 打包 Unsigned.ipa 成功！"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Unsigned-IPA
        path: QuizAppiOS/Unsigned.ipa
