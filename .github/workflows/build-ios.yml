name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show Xcode Version
      run: xcodebuild -version

    - name: Build the app
      run: |
        cd QuizAppiOS
        # 使用 xcodebuild 原生构建 iOS 版本，跳过签名
        xcodebuild build \
          -scheme QuizAppiOS \
          -sdk iphoneos \
          -configuration Release \
          -destination "generic/platform=iOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath build

    - name: Package to IPA
      run: |
        cd QuizAppiOS
        # xcodebuild 默认产物路径
        APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "未找到 .app 文件，构建可能失败。"
          exit 1
        fi
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r Unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: Unsigned-IPA
        path: QuizAppiOS/Unsigned.ipa
